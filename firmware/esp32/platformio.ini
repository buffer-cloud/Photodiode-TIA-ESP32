; Photodiode-TIA-ESP32 firmware (Rev A)
; See README.md in this directory for build/flash/protocol/timing notes,
; and docs/design-contract.md at the repo root for the electrical/protocol
; contract this firmware implements.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    links2004/WebSockets@2.7.3
