[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "photodiode-tia"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.0", "websockets>=12"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
tia-dashboard = "photodiode_tia.dashboard:main"
tia-mock = "photodiode_tia.mock_server:main"
[tool.setuptools.packages.find]
include = ["photodiode_tia*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
